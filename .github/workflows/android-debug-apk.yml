name: Build Android debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-phone-debug:
    name: Build phoneDebug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testPhoneDebugUnitTest --no-daemon

      - name: Build phoneDebug
        run: ./gradlew :app:assemblePhoneDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: haru-piece-phone-debug-apk
          path: app/build/outputs/apk/phone/debug/app-phone-debug.apk
          if-no-files-found: error
